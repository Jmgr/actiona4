[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = "true"
REMAP_PATH_FLAG = "--remap-path-prefix=${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}=/src/actiona4"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS = "${REMAP_PATH_FLAG} -C target-cpu=x86-64-v2"
CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "${REMAP_PATH_FLAG} -C target-cpu=x86-64-v2 -C target-feature=+crt-static"
CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS = "${REMAP_PATH_FLAG} -C target-cpu=x86-64-v2"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "${REMAP_PATH_FLAG} -C link-arg=-fuse-ld=mold -C target-cpu=x86-64-v2"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "clang"
VCPKGRS_TRIPLET = { value = "x64-windows-static", condition = { platforms = ["windows"] } }
OPENCV_CMAKE_ARGS = { value = "-DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_BUILD_TYPE=Release", condition = { platforms = ["windows"] } }

[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.fmt]
command = "cargo"
toolchain = "nightly"
args = ["fmt", "--all"]

[tasks.derivefmt]
command = "cargo"
args = ["derivefmt"]

[tasks.sort]
command = "cargo"
args = ["sort", "-g", "-w"]

[tasks.format]
dependencies = ["deps", "fmt", "derivefmt", "sort"]

[tasks.fmt-check]
command = "cargo"
toolchain = "nightly"
args = ["fmt", "--all", "--check"]

[tasks.derivefmt-check]
script_runner = "@shell"
script = '''
set -e
cargo derivefmt
git diff --exit-code -- '*.rs'
'''

[tasks.derivefmt-check.windows]
script_runner = "@shell"
script = '''
cargo derivefmt
if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
git diff --exit-code -- *.rs
'''

[tasks.sort-check]
command = "cargo"
args = ["sort", "-g", "-w", "--check", "--check-format"]

[tasks.format-check]
dependencies = ["deps", "fmt-check", "derivefmt-check", "sort-check"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--all", "--all-targets", "--all-features"]

[tasks.install-e2e-ts-deps]
script_runner = "@shell"
script = '''
if [ ! -x crates/e2e/node_modules/.bin/tsc ]; then
    npm ci --prefix crates/e2e
fi
'''

[tasks.install-e2e-ts-deps.windows]
script_runner = "@shell"
script = '''
if not exist crates\\e2e\\node_modules\\.bin\\tsc.cmd (
    npm ci --prefix crates/e2e
)
'''

[tasks.install-docs-site-deps]
script_runner = "@shell"
script = '''
if [ ! -x docs-site/node_modules/.bin/docusaurus ]; then
    npm ci --prefix docs-site
fi
'''

[tasks.install-docs-site-deps.windows]
script_runner = "@shell"
script = '''
if not exist docs-site\\node_modules\\.bin\\docusaurus.cmd (
    npm ci --prefix docs-site
)
'''

[tasks.install-editor-ui-deps]
script_runner = "@shell"
script = '''
if [ ! -f crates/editor/node_modules/dockview/dist/dockview.min.js ]; then
    npm ci --prefix crates/editor
fi
'''

[tasks.install-editor-ui-deps.windows]
script_runner = "@shell"
script = '''
if not exist crates\editor\node_modules\dockview\dist\dockview.min.js (
    npm ci --prefix crates/editor
)
'''

[tasks.install-trunk]
script_runner = "@shell"
script = '''
if ! command -v trunk >/dev/null 2>&1; then
    cargo install --locked trunk
fi
'''

[tasks.install-trunk.windows]
script_runner = "@shell"
script = '''
where trunk >NUL 2>NUL
if %ERRORLEVEL% NEQ 0 (
    cargo install --locked trunk
)
'''

[tasks.install-wasm-target]
command = "rustup"
args = ["target", "add", "wasm32-unknown-unknown"]

[tasks.build-editor-ui-release]
description = "Build the editor web UI for embedding in the native release executable."
dependencies = ["install-editor-ui-deps", "install-trunk", "install-wasm-target"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/crates/editor"
env = { NO_COLOR = "true" }
command = "trunk"
args = ["build", "--release", "--locked"]

[tasks.release-editor]
description = "Build the native editor with its embedded release UI."
dependencies = ["build-editor-ui-release"]
command = "cargo"
args = ["build", "-p", "editor", "--bin", "editor", "--release"]

[tasks.lint-ts]
dependencies = ["install-e2e-ts-deps"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "lint-ts"]

[tasks.build-actiona-run]
description = "Build the actiona-run binary (required before running e2e tests)."
command = "cargo"
args = ["build", "-p", "run"]

[tasks.build-extensions]
description = "Build runtime extension binaries."
command = "cargo"
args = ["build", "-p", "extension-selection", "-p", "extension-opencv"]

[tasks.build-actiona-run.windows]
args = ["build", "-p", "run", "--features", "run/windows-bin"]

[tasks.e2e]
description = "Build actiona-run and the extensions, then run end-to-end TypeScript API tests."
dependencies = ["build-actiona-run", "build-extensions"]
command = "cargo"
args = ["test", "-p", "e2e"]

[tasks.e2e-manual]
description = "Build runtime binaries then run ignored/manual end-to-end tests."
dependencies = ["build-actiona-run", "build-extensions"]
command = "cargo"
args = ["test", "-p", "e2e", "--test", "manual", "--", "--ignored", "--nocapture"]

[tasks.test]
description = "Run tests."
command = "cargo"
args = ["test", "${@}"]

[tasks.bench]
description = "Run benchmarks."
command = "cargo"
args = ["bench", "${@}"]

[tasks.lint]
dependencies = ["clippy", "lint-ts"]

[tasks.lint-windows]
condition = { platforms = ["linux"] }
description = "Lint the Windows-only code from Linux by cross-compiling the workspace with clippy. Downloads ~1.2 GB of Windows SDK and OpenCV headers into target/windows-cross on first run."
command = "cargo"
args = ["run", "-p", "xtask", "--", "lint-windows"]

[tasks.install-rustfmt]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
command = "rustup"
args = ["component", "add", "rustfmt", "--toolchain", "nightly"]

# From https://github.com/dcchut/cargo-derivefmt
# This package is currently implemented using rust-analyzer internals, so cannot be published on crates.io.
[tasks.install-derivefmt]
script_runner = "@shell"
script = '''
if ! command -v cargo-derivefmt >/dev/null 2>&1; then
    cargo install --locked --git https://github.com/dcchut/cargo-derivefmt --bin cargo-derivefmt
fi
'''

[tasks.install-derivefmt.windows]
script_runner = "@shell"
script = '''
where cargo-derivefmt >NUL 2>NUL
if %ERRORLEVEL% NEQ 0 (
    cargo install --locked --git https://github.com/dcchut/cargo-derivefmt --bin cargo-derivefmt
)
'''

[tasks.install-sort]
script_runner = "@shell"
script = '''
if ! command -v cargo-sort >/dev/null 2>&1; then
    cargo install --locked cargo-sort
fi
'''

[tasks.install-sort.windows]
script_runner = "@shell"
script = '''
where cargo-sort >NUL 2>NUL
if %ERRORLEVEL% NEQ 0 (
    cargo install --locked cargo-sort
)
'''

[tasks.install-cargo-edit]
command = "cargo"
args = ["install", "cargo-edit"]

[tasks.deps]
dependencies = ["install-rustfmt", "install-derivefmt", "install-sort"]

[tasks.doc]
condition = { platforms = ["linux"] }
dependencies = ["install-e2e-ts-deps"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "doc"]

[tasks.docs-site]
condition = { platforms = ["linux"] }
description = "Regenerate the TypeScript API declarations and build the documentation site."
dependencies = ["doc", "install-docs-site-deps"]
command = "npm"
args = ["--prefix", "docs-site", "run", "build"]

[tasks.upgrade]
description = "Upgrade dependencies, including incompatible semver updates."
dependencies = ["install-cargo-edit"]
command = "cargo"
args = ["upgrade", "--incompatible"]

[tasks.appimage]
condition = { platforms = ["linux"] }
description = "Build signed Actiona Run and Actiona Editor AppImages."
dependencies = ["release-symbols", "upload-symbols"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "app-image"]

[tasks.appimage-nosign]
condition = { platforms = ["linux"] }
description = "Build unsigned Actiona Run and Actiona Editor AppImages."
dependencies = ["release-symbols"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "app-image-no-sign"]

[tasks.release-runw]
condition = { platforms = ["windows"] }
description = "Build the actiona-runw binary in release mode (Windows only)."
command = "cargo"
args = [
    "build",
    "-p",
    "run",
    "--release",
    "--bin",
    "actiona-runw",
    "--features",
    "windows-bin",
]

[tasks.release]
description = "Build release binaries, including the editor UI, extensions, and actiona-runw on Windows."
dependencies = ["release-editor", "release-runw"]
command = "cargo"
args = [
    "build",
    "-p",
    "run",
    "-p",
    "extension-selection",
    "-p",
    "extension-opencv",
    "--release",
]

[tasks.symbols]
description = "Generate Breakpad symbol files (.sym) and strip release binaries."
command = "cargo"
args = ["run", "-p", "xtask", "--", "symbols"]

[tasks.release-symbols]
description = "Build all release binaries and generate Breakpad symbol files."
dependencies = ["release", "symbols"]

[tasks.upload-symbols]
description = "Build release binaries, generate Breakpad symbol files, and upload them to Sentry using sentry-cli."
dependencies = ["release-symbols"]
command = "sentry-cli"
args = ["debug-files", "upload", "--project", "actiona-run", "--wait", "target/symbols"]

[tasks.symbolicate]
description = "Symbolicate a minidump. Usage: cargo make symbolicate <path/to/dump.dmp>"
command = "cargo"
args = ["run", "-p", "xtask", "--", "symbolicate", "${@}"]

[tasks.sign]
condition = { platforms = ["windows"] }
description = "Sign packaged Windows release binaries with signtool (Windows only)."
dependencies = ["build-inno-plugin"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "sign-binaries"]

[tasks.release-signed]
condition = { platforms = ["windows"] }
description = "Build and sign packaged release executables (Windows only)."
dependencies = ["release", "sign"]

[tasks.build-inno-plugin]
condition = { platforms = ["windows"] }
description = "Build the Inno Setup plugin DLL as 32-bit for the installer (Windows only)."
command = "cargo"
args = ["build", "-p", "inno-plugin", "--release", "--target", "i686-pc-windows-msvc"]

[tasks.installer]
condition = { platforms = ["windows"] }
description = "Build signed Actiona Run and Actiona Editor installers with Inno Setup (Windows only)."
dependencies = ["release-symbols", "sign", "upload-symbols"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "installer"]

[tasks.installer-nosign]
condition = { platforms = ["windows"] }
description = "Build unsigned Actiona Run and Actiona Editor installers with Inno Setup (Windows only)."
dependencies = ["release-symbols", "build-inno-plugin"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "installer-no-sign"]

[tasks.installer-e2e]
condition = { platforms = ["windows"] }
description = "Install and end-to-end test the unsigned Actiona Run installer (Windows only)."
dependencies = ["installer-nosign"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "installer-e2e"]

[tasks.archive]
condition = { platforms = ["windows"] }
description = "Build signed Actiona Run and Actiona Editor zip archives (Windows only)."
dependencies = ["release-symbols", "sign", "upload-symbols"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "archive"]

[tasks.archive-nosign]
condition = { platforms = ["windows"] }
description = "Build unsigned Actiona Run and Actiona Editor zip archives (Windows only)."
dependencies = ["release-symbols"]
command = "cargo"
args = ["run", "-p", "xtask", "--", "archive-no-sign"]
